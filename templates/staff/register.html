{% extends 'base.html' %}
{% block title %}Register as Staff - PeakQuesting{% endblock %}

{% block content %}
<h3 class="text-center mt-4">Register as Trek Staff</h3>

<div class="d-flex justify-content-center mt-3">
    <div class="card" style="width: 22rem;">
        <div class="card-body">
            <form method="POST" action="/register?role=staff">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="pwd" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" name="phone" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" name="address" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Bio</label>
                    <textarea class="form-control" name="bio" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Years of Experience</label>
                    <input type="number" class="form-control" name="exp_years" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <div class="mt-3 text-center">
                <a href="/login">Already have an account? Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
