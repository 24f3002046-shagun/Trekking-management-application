<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Trek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">TrekManager</a>
    <div class="d-flex gap-3">
        <a href="/staff/dashboard" class="text-white text-decoration-none">Dashboard</a>
        <a href="/logout" class="text-white text-decoration-none">Logout</a>
    </div>
</nav>

<div class="container mt-4" style="max-width: 500px;">
    <h4 class="mb-4">Update Trek — {{ trek.name }}</h4>

    <form method="POST" action="/staff/trek/{{ trek.id }}/update">
        <div class="mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number" class="form-control" name="available_slots"
                value="{{ trek.available_slots }}" min="0" max="{{ trek.total_slots }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Trek Status</label>
            <select class="form-select" name="status" required>
                <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
            </select>
        </div>
        <button type="submit" class="btn btn-warning w-100">Save Changes</button>
        <a href="/staff/dashboard" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>
</html>
