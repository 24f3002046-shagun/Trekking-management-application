{% extends 'base.html' %}
{% block title %}Update Trek - PeakQuesting{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <h4 class="mb-4">Update Trek — {{ trek.name }}</h4>

    <form method="POST" action="/staff/trek/{{ trek.id }}/update">
        <div class="mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number" class="form-control" name="available_slots"
                value="{{ trek.available_slots }}" min="0" max="{{ trek.total_slots }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Trek Status</label>
            <select class="form-select" name="status" required>
                <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
            </select>
        </div>
        <button type="submit" class="btn btn-warning w-100">Save Changes</button>
        <a href="/staff/dashboard" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
</div>
{% endblock %}
