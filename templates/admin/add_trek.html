{% extends 'base.html' %}
{% block title %}Add Trek - PeakQuesting{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h4 class="mb-4">Add New Trek</h4>

    <form method="POST" action="/admin/trek/add">
        <div class="mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text" class="form-control" name="name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Difficulty</label>
            <select class="form-select" name="difficulty" required>
                <option value="">-- Select --</option>
                <option value="Easy">Easy</option>
                <option value="Moderate">Moderate</option>
                <option value="Hard">Hard</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Duration (in days)</label>
            <input type="number" class="form-control" name="duration" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Total Slots</label>
            <input type="number" class="form-control" name="total_slots" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" name="start_date" required>
        </div>
        <div class="mb-3">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" name="end_date" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-success w-100">Add Trek</button>
        <a href="/admin/treks" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
</div>
{% endblock %}
