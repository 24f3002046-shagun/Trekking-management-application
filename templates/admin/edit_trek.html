{% extends 'base.html' %}
{% block title %}Edit Trek - PeakQuesting{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h4 class="mb-4">Edit Trek — {{ trek.name }}</h4>

    <form method="POST" action="/admin/trek/{{ trek.id }}/edit">
        <div class="mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text" class="form-control" name="name" value="{{ trek.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location" value="{{ trek.location }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Difficulty</label>
            <select class="form-select" name="difficulty" required>
                <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Duration (in days)</label>
            <input type="number" class="form-control" name="duration" value="{{ trek.duration }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Total Slots</label>
            <input type="number" class="form-control" name="total_slots" value="{{ trek.total_slots }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number" class="form-control" name="available_slots" value="{{ trek.available_slots }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" name="status" required>
                <option value="Pending" {% if trek.status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Approved" {% if trek.status == 'Approved' %}selected{% endif %}>Approved</option>
                <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" name="start_date" value="{{ trek.start_date }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" name="end_date" value="{{ trek.end_date }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="3">{{ trek.description }}</textarea>
        </div>
        <button type="submit" class="btn btn-warning w-100">Save Changes</button>
        <a href="/admin/treks" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
</div>
{% endblock %}
