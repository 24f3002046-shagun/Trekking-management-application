<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Trek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">TrekManager</a>
    <div class="d-flex gap-3">
        <a href="/admin/dashboard" class="text-white text-decoration-none">Dashboard</a>
        <a href="/admin/treks" class="text-white text-decoration-none">Treks</a>
        <a href="/admin/users" class="text-white text-decoration-none">Users</a>
        <a href="/admin/staff" class="text-white text-decoration-none">Staff</a>
        <a href="/admin/bookings" class="text-white text-decoration-none">Bookings</a>
        <a href="/admin/search" class="text-white text-decoration-none">Search</a>
        <a href="/logout" class="text-white text-decoration-none">Logout</a>
    </div>
</nav>

<div class="container mt-4" style="max-width: 600px;">
    <h4 class="mb-4">Edit Trek — {{ trek.name }}</h4>

    <form method="POST" action="/admin/trek/{{ trek.id }}/edit">
        <div class="mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text" class="form-control" name="name" value="{{ trek.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location" value="{{ trek.location }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Difficulty</label>
            <select class="form-select" name="difficulty" required>
                <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Duration (in days)</label>
            <input type="number" class="form-control" name="duration" value="{{ trek.duration }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Total Slots</label>
            <input type="number" class="form-control" name="total_slots" value="{{ trek.total_slots }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number" class="form-control" name="available_slots" value="{{ trek.available_slots }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" name="status" required>
                <option value="Pending" {% if trek.status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Approved" {% if trek.status == 'Approved' %}selected{% endif %}>Approved</option>
                <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" name="start_date" value="{{ trek.start_date }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" name="end_date" value="{{ trek.end_date }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="3">{{ trek.description }}</textarea>
        </div>
        <button type="submit" class="btn btn-warning w-100">Save Changes</button>
        <a href="/admin/treks" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>
</html>
