<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assign Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">TrekManager</a>
    <div class="d-flex gap-3">
        <a href="/admin/dashboard" class="text-white text-decoration-none">Dashboard</a>
        <a href="/admin/treks" class="text-white text-decoration-none">Treks</a>
        <a href="/admin/users" class="text-white text-decoration-none">Users</a>
        <a href="/admin/staff" class="text-white text-decoration-none">Staff</a>
        <a href="/admin/bookings" class="text-white text-decoration-none">Bookings</a>
        <a href="/admin/search" class="text-white text-decoration-none">Search</a>
        <a href="/logout" class="text-white text-decoration-none">Logout</a>
    </div>
</nav>

<div class="container mt-4" style="max-width: 500px;">
    <h4 class="mb-4">Assign Staff to — {{ trek.name }}</h4>

    {% if staff_list %}
    <form method="POST" action="/admin/trek/{{ trek.id }}/assign">
        <div class="mb-3">
            <label class="form-label">Select Staff Member</label>
            <select class="form-select" name="staff_id" required>
                <option value="">-- Select Staff --</option>
                {% for staff in staff_list %}
                <option value="{{ staff.id }}"
                    {% if trek.assigned_staff_id == staff.id %}selected{% endif %}>
                    {{ staff.user.name }} ({{ staff.exp_years }} yrs exp)
                </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-info w-100">Assign Staff</button>
        <a href="/admin/treks" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
    {% else %}
    <div class="alert alert-warning">
        No approved staff available. Please approve staff first from 
        <a href="/admin/staff">Staff Management</a>.
    </div>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>
</html>
