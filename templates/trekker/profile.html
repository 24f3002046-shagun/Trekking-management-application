<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">TrekManager</a>
    <div class="d-flex gap-3">
        <a href="/trekker/dashboard" class="text-white text-decoration-none">Dashboard</a>
        <a href="/trekker/treks" class="text-white text-decoration-none">Browse Treks</a>
        <a href="/trekker/bookings" class="text-white text-decoration-none">My Bookings</a>
        <a href="/trekker/profile/edit" class="text-white text-decoration-none">Edit Profile</a>
        <a href="/logout" class="text-white text-decoration-none">Logout</a>
    </div>
</nav>

<div class="container mt-4" style="max-width: 500px;">
    <h4 class="mb-4">Edit Profile</h4>

    <form method="POST" action="/trekker/profile/edit">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled>
            <small class="text-muted">Email cannot be changed.</small>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" name="phone" value="{{ user.phone }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" name="address" value="{{ user.address }}">
        </div>
        <button type="submit" class="btn btn-primary w-100">Save Changes</button>
        <a href="/trekker/dashboard" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>
</html>
