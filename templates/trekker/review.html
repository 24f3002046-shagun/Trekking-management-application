{% extends 'base.html' %}
{% block title %}Review Trek - PeakQuesting{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h4 class="mb-3">Share your experience for {{ trek.name }}</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Rating</label>
                    <select class="form-select" name="rating" required>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Great</option>
                        <option value="3">3 - Good</option>
                        <option value="2">2 - Fair</option>
                        <option value="1">1 - Poor</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Story / feedback</label>
                    <textarea class="form-control" name="comment" rows="4" placeholder="Tell fellow trekkers what made this trek special." required></textarea>
                </div>
                <button type="submit" class="btn btn-success">Submit review</button>
                <a href="/trekker/bookings" class="btn btn-outline-secondary">Back</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
